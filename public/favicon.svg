<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a96e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0d5a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b6e2f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b3fa0;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#3d1a6e;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a840;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5e1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Bottle body -->
  <rect x="9" y="14" width="14" height="14" rx="3" fill="url(#liquidGrad)" stroke="url(#bottleGrad)" stroke-width="1.2"/>
  <!-- Liquid shine -->
  <rect x="11" y="16" width="4" height="8" rx="1.5" fill="white" opacity="0.12"/>
  <!-- Bottle neck -->
  <rect x="12.5" y="10" width="7" height="5" rx="1" fill="url(#bottleGrad)" stroke="url(#capGrad)" stroke-width="0.8"/>
  <!-- Cap top -->
  <rect x="11" y="7" width="10" height="4" rx="2" fill="url(#capGrad)"/>
  <!-- Spray nozzle -->
  <rect x="20" y="8.5" width="4" height="1.5" rx="0.75" fill="url(#capGrad)"/>
  <circle cx="24.5" cy="9.25" r="1" fill="url(#capGrad)"/>
  <!-- Spray mist dots -->
  <circle cx="26" cy="7" r="0.6" fill="#c9a96e" opacity="0.6"/>
  <circle cx="27.5" cy="8.5" r="0.5" fill="#c9a96e" opacity="0.4"/>
  <circle cx="26.5" cy="10" r="0.4" fill="#c9a96e" opacity="0.3"/>
  <!-- Highlight on bottle -->
  <path d="M11 17 Q11 14 14 14" stroke="white" stroke-width="0.8" opacity="0.2" fill="none" stroke-linecap="round"/>
</svg>
